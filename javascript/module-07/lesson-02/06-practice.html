<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Search</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/mustard-ui@latest/dist/css/mustard-ui.min.css"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/practice.css" />
  </head>
  <body>
    <p><a href="index.html">Go back</a></p>
    <main class="container">
      <form action="submit" class="js-form car-search">
        <div class="car-group">
          <input
            class="car-input"
            type="text"
            name="query"
            placeholder="Пошук"
          />
          <select class="car-select" name="options">
            <option value="car">Марка</option>
            <option value="type">Модель</option>
          </select>
        </div>
        <button class="car-button">Пошук</button>
      </form>

      <ul class="car-list js-list"></ul>
    </main>

    <script src="./js/06-practice.js"></script>
  </body>
</html>
