<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <section class="py-4 container">
      <form class="js-search-form">
        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Search image"
            aria-label="Search image"
            aria-describedby="button-addon2"
            name="query"
          />
          <button
            class="btn btn-outline-secondary"
            type="submit"
            id="button-addon2"
          >
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
    </section>

    <div
      class="js-alert collapse alert alert-warning fixed-bottom p-4"
      style="max-width: 300px; right: 20px; left: unset"
      role="alert"
    >
      <button
        class="btn-close position-absolute"
        style="right: 4px; top: 4px"
        type="button"
        aria-label="Close"
      ></button>

      <i class="bi bi-exclamation-triangle"></i>
      Search query can't be empty!
    </div>

    <div class="modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
              data-modal-close
            ></button>
          </div>
          <div class="modal-body">
            <p>Please, leave your email for subscription</p>
            <div class="mb-3">
              <label
                for="exampleFormControlInput1"
                class="form-label visually-hidden"
                >Email address</label
              >
              <input
                type="email"
                class="form-control"
                id="exampleFormControlInput1"
                placeholder="name@example.com"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-modal-send>
              Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/js/notification-practice.js"></script>
  </body>
</html>
