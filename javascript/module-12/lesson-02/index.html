    <div class="container">
      <h2 class="display-3 mb-4">📱 Contacts book</h2>

      <ul class="contacts-list mb-3 row g-1"></ul>

      <button class="btn btn-primary d-none" type="button" data-load-more>
        <span
          class="spinner-border spinner-border-sm d-none"
          aria-hidden="true"
        ></span>
        <span role="status">Load more</span>
      </button>
    </div>

    <div class="toast-container p-3 top-0 end-0" id="toastPlacement">
      <div
        class="toast align-items-center text-bg-primary border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body">Last contact group</div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <script type="module" src="src/index.js"></script>
